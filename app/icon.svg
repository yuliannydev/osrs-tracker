<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!-- Background circle -->
  <circle cx="36" cy="36" r="36" fill="#2a1f15"/>
  
  <!-- Sword blade (diagonal, top-right to bottom-left) -->
  <g transform="translate(36,36) rotate(-45)">
    <!-- Blade -->
    <polygon points="0,-26 3,-10 -3,-10" fill="#e8e0c8"/>
    <!-- Crossguard -->
    <rect x="-10" y="-8" width="20" height="4" rx="2" fill="#ff9900"/>
    <!-- Handle -->
    <rect x="-2.5" y="-4" width="5" height="14" rx="1.5" fill="#b36e00"/>
    <!-- Pommel -->
    <circle cx="0" cy="12" r="4" fill="#ff9900"/>
    <!-- Blade shine -->
    <polygon points="0,-26 1,-12 0,-10" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>
